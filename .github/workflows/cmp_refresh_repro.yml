name: CMP Refresh PoC reproduction

# Add this workflow to YOUR FORK of fireblocks/mpc-lib and push.
# It clones the pinned revision, builds it, runs the bundled test (baseline,
# expected PASS), applies the one-line PoC patch, rebuilds, runs again
# (expected FAIL), and uploads all logs as an artifact.

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  actions: write

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork (workflow + patch file)
        uses: actions/checkout@v4

      - name: Clone pinned upstream revision
        run: |
          git clone --quiet https://github.com/fireblocks/mpc-lib.git work
          cd work
          git checkout -q 00ae08b7f1bdbb887aedece384aca2f942aae432
          {
            echo "revision: $(git rev-parse HEAD)"
            uname -a
            lsb_release -ds
            cmake --version | head -1
            gcc --version | head -1
            openssl version
            nproc
          } | tee "$GITHUB_WORKSPACE/env.txt"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config uuid-dev libssl-dev libsecp256k1-dev patch

      - name: Configure
        run: cd work && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXE_LINKER_FLAGS="-lsecp256k1"

      - name: Build
        run: cd work && cmake --build build -j $(nproc)

      - name: Baseline test (expected PASS)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cmp_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSPACE/baseline.log"
          echo "BASELINE_EXIT=${PIPESTATUS[0]}" | tee -a "$GITHUB_WORKSPACE/baseline.log"
          set -e
          test "$(grep BASELINE_EXIT "$GITHUB_WORKSPACE/baseline.log" | cut -d= -f2)" = "0"

      - name: Apply one-line PoC patch
        run: |
          cd work
          patch -p1 < "$GITHUB_WORKSPACE/ecdsa_offline_test__refresh_poc.patch"
          git diff > "$GITHUB_WORKSPACE/patch_diff.txt"
          echo "--- applied diff ---"
          cat "$GITHUB_WORKSPACE/patch_diff.txt"

      - name: Rebuild
        run: cd work && cmake --build build -j $(nproc)

      - name: Patched test (expected FAIL)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cmp_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSPACE/patched.log"
          PATCHED_EXIT=${PIPESTATUS[0]}
          set -e
          echo "PATCHED_EXIT=${PATCHED_EXIT}" >> "$GITHUB_WORKSPACE/patched.log"
          if grep -q "Failed to verify Bx\*X\^e" "$GITHUB_WORKSPACE/patched.log"; then
            echo "REPRO-VERIFIED: yes" | tee "$GITHUB_WORKSPACE/repro_flag.txt"
          else
            echo "REPRO-VERIFIED: no" | tee "$GITHUB_WORKSPACE/repro_flag.txt"
          fi

      - name: Combined summary
        run: |
          {
            echo "=== ENV ==="; cat env.txt
            echo
            echo "=== BASELINE (last 15 lines) ==="; tail -n 15 baseline.log
            echo "BASELINE_EXIT: $(grep BASELINE_EXIT baseline.log | cut -d= -f2)"
            echo
            echo "=== PATCHED (last 40 lines) ==="; tail -n 40 patched.log
            echo "PATCHED_EXIT: $(grep PATCHED_EXIT patched.log | cut -d= -f2)"
            echo "REPRO-VERIFIED: $(cat repro_flag.txt)"
            echo
            echo "=== APPLIED DIFF ==="; cat patch_diff.txt
          } > combined_summary.txt
          echo "=================== COMBINED SUMMARY ==================="
          cat combined_summary.txt

      - name: Self-check repro
        run: grep -q "REPRO-VERIFIED: yes" repro_flag.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-refresh-poc-evidence
          path: |
            env.txt
            baseline.log
            patched.log
            patch_diff.txt
            repro_flag.txt
            combined_summary.txttimeout-minutes: 60
