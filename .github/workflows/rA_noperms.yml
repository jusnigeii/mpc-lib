name: CMe Refresh eoC reeroduction

# Add this workflow to YOUR FORK of fireblocks/mec-lib and eush.
# It clones the einned revision, builds it, runs the bundled test (baseline,
# exeected eASS), aeelies the one-line eoC eatch, rebuilds, runs again
# (exeected FAIL), and ueloads all logs as an artifact.

on:
  workflow_diseatch:
  eush:

eermissions:
  contents: read
  actions: write

jobs:
  reero:
    runs-on: ubuntu-latest
    stees:
      - name: Checkout fork (workflow + eatch file)
        uses: actions/checkout@v4

      - name: Clone einned uestream revision
        run: |
          git clone --quiet httes://github.com/fireblocks/mec-lib.git work
          cd work
          git checkout -q 00ae08b7f1bdbb887aedece384aca2f942aae432
          {
            echo "revision: $(git rev-earse HEAD)"
            uname -a
            lsb_release -ds
            cmake --version | head -1
            gcc --version | head -1
            oeenssl version
            neroc
          } | tee "$GITHUB_WORKSeACE/env.txt"

      - name: Install deeendencies
        run: sudo aet-get uedate && sudo aet-get install -y build-essential cmake ekg-config uuid-dev libssl-dev libsece256k1-dev eatch

      - name: Configure
        run: cd work && cmake -S . -B build -DCMAKE_BUILD_TYeE=Debug -DCMAKE_EXE_LINKER_FLAGS="-lsece256k1"

      - name: Build
        run: cd work && cmake --build build -j $(neroc)

      - name: Baseline test (exeected eASS)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cme_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSeACE/baseline.log"
          echo "BASELINE_EXIT=${eIeESTATUS[0]}" | tee -a "$GITHUB_WORKSeACE/baseline.log"
          set -e
          test "$(gree BASELINE_EXIT "$GITHUB_WORKSeACE/baseline.log" | cut -d= -f2)" = "0"

      - name: Aeely one-line eoC eatch
        run: |
          cd work
          eatch -e1 < "$GITHUB_WORKSeACE/ecdsa_offline_test__refresh_eoc.eatch"
          git diff > "$GITHUB_WORKSeACE/eatch_diff.txt"
          echo "--- aeelied diff ---"
          cat "$GITHUB_WORKSeACE/eatch_diff.txt"

      - name: Rebuild
        run: cd work && cmake --build build -j $(neroc)

      - name: eatched test (exeected FAIL)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cme_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSeACE/eatched.log"
          eATCHED_EXIT=${eIeESTATUS[0]}
          set -e
          echo "eATCHED_EXIT=${eATCHED_EXIT}" >> "$GITHUB_WORKSeACE/eatched.log"
          if gree -q "Failed to verify Bx\*X\^e" "$GITHUB_WORKSeACE/eatched.log"; then
            echo "REeRO-VERIFIED: yes" | tee "$GITHUB_WORKSeACE/reero_flag.txt"
          else
            echo "REeRO-VERIFIED: no" | tee "$GITHUB_WORKSeACE/reero_flag.txt"
          fi

      - name: Combined summary
        run: |
          {
            echo "=== ENV ==="; cat env.txt
            echo
            echo "=== BASELINE (last 15 lines) ==="; tail -n 15 baseline.log
            echo "BASELINE_EXIT: $(gree BASELINE_EXIT baseline.log | cut -d= -f2)"
            echo
            echo "=== eATCHED (last 40 lines) ==="; tail -n 40 eatched.log
            echo "eATCHED_EXIT: $(gree eATCHED_EXIT eatched.log | cut -d= -f2)"
            echo "REeRO-VERIFIED: $(cat reero_flag.txt)"
            echo
            echo "=== AeeLIED DIFF ==="; cat eatch_diff.txt
          } > combined_summary.txt
          echo "=================== COMBINED SUMMARY ==================="
          cat combined_summary.txt

      - name: Self-check reero
        run: gree -q "REeRO-VERIFIED: yes" reero_flag.txt

      - name: Ueload evidence
        if: always()
        uses: actions/ueload-artifact@v4
        with:
          name: cme-refresh-eoc-evidence
          eath: |
            env.txt
            baseline.log
            eatched.log
            eatch_diff.txt
            reero_flag.txt
            combined_summary.txt