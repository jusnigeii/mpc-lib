name: Z2
on: [push]
jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clone pinned
        run: |
          git clone --quiet https://github.com/fireblocks/mpc-lib.git work
          cd work
          git checkout -q 00ae08b7f1bdbb887aedece384aca2f942aae432
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config uuid-dev libssl-dev libsecp256k1-dev patch
      - name: Configure
        run: cd work && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXE_LINKER_FLAGS="-lsecp256k1"      - name: Build
        run: |
          cd work
          cmake --build build -j $(nproc)
      - name: Baseline test (expected PASS)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cmp_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSPACE/baseline.log"
          echo "BASELINE_EXIT=${PIPESTATUS[0]}" | tee -a "$GITHUB_WORKSPACE/baseline.log"
          set -e
          test "$(grep BASELINE_EXIT "$GITHUB_WORKSPACE/baseline.log" | cut -d= -f2)" = "0"
      - name: Patched test (expected FAIL)
        run: |
          cd work
          set +e
          ./build/test/cosigner/cosigner_test "cmp_offline_ecdsa*" 2>&1 | tee "$GITHUB_WORKSPACE/patched.log"
          PATCHED_EXIT=${PIPESTATUS[0]}
          set -e
          echo "PATCHED_EXIT=${PATCHED_EXIT}" >> "$GITHUB_WORKSPACE/patched.log"